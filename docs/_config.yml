about_content: | # this will include new lines to allow paragraphs
    Having a deep curiosity for ML, MLOps, and AI, I am thrilled to be in a constantly evolving field. Here are a few of my projects. Looking forward to adding work showcasing my growing joy and familiarity with Generative AI soon! 

